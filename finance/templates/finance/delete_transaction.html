{%extends "finance/base.html" %}
{% block content %}
<div class="max-w-xl mx-auto mt-10 p-6 rounded shadow bg-violet-300">
  <h2 class="text-2xl font-bold mb-4 text-gray-800">Delete Transaction</h2>
  <p class="mb-4 text-gray-700">Are you sure you want to delete your trasaction for <strong>{{ object.title }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
      Yes, Delete
    </button>
    <a href="{% url 'transaction_list' %}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
  </form>
</div>
{% endblock %}
