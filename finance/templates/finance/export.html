{% extends "finance/base.html" %}
{% block title %}Export Transactions{% endblock title %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-gradient-to-r from-[#ef32d9] to-[#89fffd] p-8 rounded-lg shadow-md">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-black mb-6">Export Transaction</h1>
      <p class="mt-2 text-sm text-gray-600">Filter your statement</p>
    </div>

    <form action="{% url 'export_transactions' %}" method="get">
      {% csrf_token %}
    <div>

    <!-- Transaction Type -->
    <p class="block text-black font-bold mb-2">Type of Transaction</p>

    <label for="income">
      <input type="checkbox" name="transaction_type" value="income" id="income"> Income
    </label><br>

    <label for="expense">
      <input type="checkbox" name="transaction_type" value="expense" id="expense"> Expense
    </label>

    <!-- Categories -->
    <p class="block text-black font-bold mb-2 mt-4">Select Category</p>

    <label for="salary">
      <input type="checkbox" name="category" value="salary" id="salary"> Salary
    </label><br>

    <label for="business">
      <input type="checkbox" name="category" value="business" id="business"> Business
    </label><br>

    <label for="food">
      <input type="checkbox" name="category" value="food" id="food"> Food
    </label><br>

    <label for="entertainment">
      <input type="checkbox" name="category" value="entertainment" id="entertainment"> Entertainment
    </label><br>

    <label for="utilities">
      <input type="checkbox" name="category" value="utilities" id="utilities"> Utilities
    </label><br>

    <label for="transportation">
      <input type="checkbox" name="category" value="transportation" id="transportation"> Transportation
    </label><br>

    <label for="health">
      <input type="checkbox" name="category" value="health" id="health"> Health
    </label><br>

    <label for="others">
      <input type="checkbox" name="category" value="others" id="others"> Others
    </label>

    <!-- Dates -->
    <label class="block text-black font-bold mb-2 mt-4" for="start_date">Start Date:</label>
    <input type="date" id="start_date" name="start_date" class="w-full px-3 py-2 border border-gray-300 rounded-md">

    <label class="block text-black font-bold mb-2 mt-4" for="end_date">End Date:</label>
    <input type="date" id="end_date" name="end_date" class="w-full px-3 py-2 border border-gray-300 rounded-md">

    <div class="mt-4 text-center text-gray-600">
      <button type="submit" name="export" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 text-sm">
        Export Transactions
      </button>
    </div>
    
     </div>
    </form>

  </div>
</div>

<script>
  const incomeBox = document.getElementById("income");
  const expenseBox = document.getElementById("expense");

  const categories = {
    income: ["salary", "business"],
    expense: ["food", "utilities", "transportation", "entertainment", "health", "others"]
  };

  function updateCategories() {
    // First clear all selections and enable everything
    document.querySelectorAll("input[name='category']").forEach(cb => {
      cb.checked = false;
      cb.disabled = false;
    });

    if (incomeBox.checked && !expenseBox.checked) {
      // Enable only income categories
      categories.income.forEach(id => {
        const el = document.getElementById(id);
        el.checked = true;
        el.disabled = false;
      });
      categories.expense.forEach(id => {
        document.getElementById(id).disabled = true;
      });
    } else if (!incomeBox.checked && expenseBox.checked) {
      // Enable only expense categories
      categories.expense.forEach(id => {
        const el = document.getElementById(id);
        el.checked = true;
        el.disabled = false;
      });
      categories.income.forEach(id => {
        document.getElementById(id).disabled = true;
      });
    } else if (incomeBox.checked && expenseBox.checked) {
      // Both checked → enable and select all
      document.querySelectorAll("input[name='category']").forEach(cb => {
        cb.checked = true;
        cb.disabled = false;
      });
    }
  }

  incomeBox.addEventListener("change", updateCategories);
  expenseBox.addEventListener("change", updateCategories);
</script>

{% endblock %}
