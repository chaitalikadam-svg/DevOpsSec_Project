<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
<title>
    {% block title %} {% endblock title %}
</title>
</head>
<body class = "bg-gray-100 min-h-screen">
<nav class="bg-indigo-900 p-5 text-white shadow-md">
    {% if user.is_authenticated %}
    <a href = "{% url 'dashboard' %}" class="mr-4 text-white hover:text-blue-200">Dashboard</a>
    <a href="{% url 'add_transaction' %}" class="mr-4 text-white hover:text-blue-200">Add Transaction</a>
    <a href="{% url 'transaction_list' %}" class="mr-4 text-white hover:text-blue-200">Transaction List</a>
    <a href="{% url 'goal_add' %}" class="mr-4 text-white hover:text-blue-200">Goal List</a>
    <a href="{% url 'analysis' %}" target="_blank" class="mr-4 text-white hover:text-blue-200">Analysis</a>

    <form id ="logout-form" action="{% url 'logout' %}" method="post" style="display: inline;">
        {% csrf_token %}
        <a href ="#" onclick = "document.getElementById('logout-form').submit();" class="mr-4 text-white hover:text-blue-200">Logout</a>
    </form>

    {%else%}
        <a href="{% url 'login' %}" class="mr-4 text-white hover:text-blue-200">Login</a>
        <a href="{% url 'register' %}" class="mr-4 text-white hover:text-blue-200">Register</a>
    {% endif %}
    
    
</nav>
{% block content %}{% endblock content %}
</body>
</html>
