<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
<title>
    {% block title %} {% endblock title %}
</title>
</head>
<body class="min-h-screen bg-gradient-to-r from-[#fcb045] via-[#fd1d1d] to-[#833ab4]">
<nav class="p-5 text-white shadow-md  bg-gradient-to-r from-[#fcb045] via-[#fd1d1d] to-[#833ab4]">
    <!--If logged in as user-->
    {% if user.is_authenticated %}
    <a href = "{% url 'dashboard' %}" class="mr-5 hover:font-bold hover:underline hover:text-blue-300 ">Dashboard</a>
    <a href="{% url 'add_transaction' %}" class="mr-5 text-white hover:font-bold hover:underline hover:text-blue-300 ">Add Transaction</a>
    <a href="{% url 'transaction_list' %}" class="mr-5 text-white hover:font-bold hover:underline hover:text-blue-300 ">Transaction List</a>
    <a href="{% url 'goal_add' %}" class="mr-5 text-white hover:underline hover:font-bold hover:text-blue-300">Goal List</a>
    <a href="{% url 'analysis' %}" target="_blank" class="mr-5 text-white hover:font-bold hover:underline hover:text-blue-300">Analysis</a>
    <a href="{% url 'export_transactions' %}" target="_blank" class="mr-5 text-white hover:font-bold hover:underline hover:text-blue-300">Export Transactions</a>

    <form id="logout-form" action="{% url 'logout' %}" method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="mr-5 text-white hover:underline hover:text-blue-300">
            Logout
        </button>
    </form>

    {%else%}
        <a href="{% url 'login' %}" class="mr-5 hover:font-bold text-white hover:underline hover:text-blue-300">Login</a>
        <a href="{% url 'register' %}" class="mr-5 hover:font-bold text-white hover:underline hover:text-blue-300">Register</a>
    {% endif %}
    
    
</nav>
{% block content %}{% endblock content %}
</body>
</html>
