{%extends "finance/base.html" %}
{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-violet-300 p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-4 text-gray-800">Edit Transaction</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-blue-700">
      Save Changes
    </button>
    <a href="{% url 'transaction_list' %}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
  </form>
</div>

<style>
  form p {
    margin-bottom: 1rem;
  }

  form label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  form input,
  form select,
  form textarea {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid #ccc;
    border-radius: 0.375rem;
  }
</style>

{% endblock %}
