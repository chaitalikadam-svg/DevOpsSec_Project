{% extends "finance/base.html" %}
{% block title %}Analysis{% endblock title %}

{% block content %}
<div class="container mx-auto p-6">
  <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">
    Financial Analysis
  </h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- Expense Chart -->
    <div class="bg-white shadow-md rounded-lg p-6">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">
        Expense Breakdown
      </h2>
      <canvas id="expenseChart"></canvas>
    </div>

    <!-- Income Chart -->
    <div class="bg-white shadow-md rounded-lg p-6">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">
        Income Breakdown
      </h2>
      <canvas id="incomeChart"></canvas>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const expenseCtx = document.getElementById('expenseChart').getContext('2d');
  const incomeCtx = document.getElementById('incomeChart').getContext('2d');

  new Chart(expenseCtx, {
    type: 'pie',
    data: {
      labels: {{ expense_labels|safe }},
      datasets: [{
        label: 'Expenses',
        data: {{ expense_data|safe }},
        backgroundColor: [
          '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
          '#9966FF', '#FF9F40', '#C9CBCF', '#8FBC8F'
        ],
        borderColor: '#ffffff',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      plugins: {
        title: {
          display: true,
          text: 'Expenses by Category'
        }
      }
    }
  });

  new Chart(incomeCtx, {
    type: 'pie',
    data: {
      labels: {{ income_labels|safe }},
      datasets: [{
        label: 'Income',
        data: {{ income_data|safe }},
        backgroundColor: [
          '#4BC0C0', '#9966FF', '#FF6384', '#36A2EB',
          '#FFCE56', '#FF9F40', '#C9CBCF', '#8FBC8F'
        ],
        borderColor: '#ffffff',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      plugins: {
        title: {
          display: true,
          text: 'Income by Category'
        }
      }
    }
  });
</script>
{% endblock content %}
