{% extends "finance/base.html" %}
{% block title %}Analysis{% endblock title %}

{% block content %}
<div class="container mx-auto p-6">
  <h1 class="text-3xl font-bold text-center text-white mb-8">
    Financial Analysis
  </h1>
  
<form method="get" action="{% url 'analysis' %}" class="mb-6 bg-white p-6 rounded-lg shadow-md">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
    
    <div>
      <label for="start_date" class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
      <input type="date" name="start_date" id="start_date"
             value="{{ request.GET.start_date }}"
             class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label for="end_date" class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
      <input type="date" name="end_date" id="end_date"
             value="{{ request.GET.end_date }}"
             class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <button type="submit"
              class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
        Analyze My Finances
      </button>
    </div>

  </div>
</form>
{% if show_charts %}
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- Expense Chart -->
    <div class="bg-white shadow-md rounded-lg p-6">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">
        Expense Breakdown
      </h2>
      <canvas id="expenseChart"></canvas>
    </div>

    <!-- Income Chart -->
    <div class="bg-white shadow-md rounded-lg p-6">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">
        Income Breakdown
      </h2>
      <canvas id="incomeChart"></canvas>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const expenseCtx = document.getElementById('expenseChart').getContext('2d');
  const incomeCtx = document.getElementById('incomeChart').getContext('2d');

  new Chart(expenseCtx, {
    type: 'pie',
    data: {
      labels: {{ expense_labels|safe }},
      datasets: [{
        label: 'Expenses',
        data: {{ expense_data|safe }},
        backgroundColor: [
          '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
          '#9966FF', '#FF9F40', '#C9CBCF', '#8FBC8F'
        ],
        borderColor: '#ffffff',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      plugins: {
        title: {
          display: true,
          text: 'Expenses by Category'
        }
      }
    }
  });

  new Chart(incomeCtx, {
    type: 'pie',
    data: {
      labels: {{ income_labels|safe }},
      datasets: [{
        label: 'Income',
        data: {{ income_data|safe }},
        backgroundColor: [
          '#4BC0C0', '#9966FF', '#FF6384', '#36A2EB',
          '#FFCE56', '#FF9F40', '#C9CBCF', '#8FBC8F'
        ],
        borderColor: '#ffffff',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      plugins: {
        title: {
          display: true,
          text: 'Income by Category'
        }
      }
    }
  });
  

</script>
<p class="whitespace-pre-line mt-4 text-sm text-gray-700 font-semibold">{{ summarise }}</p> <br>
{% endif %}
{% endblock content %}
