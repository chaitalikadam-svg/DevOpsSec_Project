<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>FinTrack</title>
</head>
<body class="min-h-screen bg-gradient-to-r from-[#fcb045] via-[#fd1d1d] to-[#833ab4] text-white flex flex-col items-center justify-center px-6">

    <h1 class="text-4xl font-extrabold mb-6">Welcome to Personal Finance Tracker Application</h1>
    <p class="mb-10 text-center max-w-xl text-lg">
        Manage your finances easily. Please select whether you want to register or you already have an account so you can sign in.
    </p>

    <div class="flex space-x-8">
        <a href="{% url 'login' %}">
            <button class="px-10 py-4 text-xl font-semibold bg-white text-[#fd1d1d] rounded-lg shadow-lg hover:bg-blue-300 hover:text-white transition">
                Login
            </button>
        </a>
        <a href="{% url 'register' %}">
            <button class="px-10 py-4 text-xl font-semibold bg-white text-[#833ab4] rounded-lg shadow-lg hover:bg-blue-300 hover:text-white transition">
                Register
            </button>
        </a>
    </div>

</body>
</html>
